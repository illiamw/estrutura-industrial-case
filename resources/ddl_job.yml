
resources:
  jobs:
    ddl_deploy:
      name: ddl-deploy

      tasks:
        - task_key: execute_ddl

          spark_python_task:
            python_file: ../src/ddl/deploy.py

            parameters:
              - "--sql-path"
              - "sql/"

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
