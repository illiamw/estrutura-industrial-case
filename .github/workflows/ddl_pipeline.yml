name: Databricks DDL Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate SQL
        run: python -m src.ddl.sql_parser

      - name: Validate naming
        run: python -m src.governance.naming_validator

      - name: Validate descriptions
        run: python -m src.governance.description_validator

      - name: Validate type
        run: python -m src.governance.type_validator

      - name: Run unit tests
        run: |
          python -m pytest tests/unit \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=50

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Inspect Databricks Authentication
        run: |
          echo "=== ENVIRONMENT ==="
          echo "HOST: $DATABRICKS_HOST"

          echo "=== CREDENTIALS ==="
          test -n "$DATABRICKS_TOKEN" && echo "TOKEN: PRESENT" || echo "TOKEN: MISSING"

          echo "=== CLI VERSION ==="
          databricks version

          echo "=== AUTH CONFIGURATION ==="
          databricks auth describe || true
      
      
      # Authentication test
      - name: Test Databricks Authentication
        run: databricks current-user me --profile default

      # Bundle validation
      - name: Validate Databricks Bundle
        run: databricks bundle validate --target prod

      # Deploy
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy --target prod

      - name: Execute DDL Job
        run: databricks bundle run ddl_deploy --target prod

